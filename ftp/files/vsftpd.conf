# Ejecución en modo independiente (standalone) escuchando únicamente en IPv4
listen=YES
listen_ipv6=NO

# Acceso restringido exclusivamente a usuarios locales autenticados (sin anónimos)
anonymous_enable=NO
local_enable=YES
write_enable=YES

# Máscara 002 para que los archivos subidos tengan permisos 0664 y Apache pueda leerlos
local_umask=002
file_open_mode=0666

# Registro de actividad y transferencias
dirmessage_enable=YES
use_localtime=YES
log_ftp_protocol=YES
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
connect_from_port_20=YES

# Enjaulamiento de usuarios en su directorio personal por defecto
chroot_local_user=YES
# Permite que el directorio raíz del usuario enjaulado tenga permisos de escritura
allow_writeable_chroot=YES
# Lista de excepciones: los usuarios incluidos aquí (ana) pueden salir de su home
chroot_list_enable=YES
chroot_list_file=/etc/vsftpd.chroot_list

# Configuración de FTPS explícito sobre TLS (deshabilitando protocolos SSL antiguos)
ssl_enable=YES
allow_anon_ssl=NO
force_local_logins_ssl=YES
force_local_data_ssl=YES
require_ssl_reuse=NO
ssl_ciphers=HIGH
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO

# Rutas del certificado autofirmado y su clave privada
rsa_cert_file=/etc/ssl/pserrod869/pserrod869.test.crt
rsa_private_key_file=/etc/ssl/pserrod869/pserrod869.test.key

# Configuración de puertos para modo pasivo en la red privada
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
pasv_address=192.168.57.7